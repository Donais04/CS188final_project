
{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="loginWorkspace">

    <div class="loginBox">

        <h1>Welcome</h1>

        <form method="POST" action="">

            <div class="loginField">
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="textboxLogin"
                    required
                >
            </div>

            <div class="loginField">
                <label for="password">Password:</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="textboxLogin"
                    required
                >
            </div>

            <button type="submit" class="loginButton">
                Login
            </button>

        </form>

        <a href="#" class="createAccount">
            Create Account
        </a>

    </div>

</div>

{% endblock %}
